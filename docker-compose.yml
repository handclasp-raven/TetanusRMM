# Local deployment: server + Postgres.
#
#   cargo run -p server -- gen-certs     # once, creates ./dev-certs
#   mkdir -p updates                     # published agent builds (see README)
#   docker compose up --build
#
# Settings can be overridden in a .env file next to this one (see README).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmm-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-rmm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    image: rmm-server:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Run as the host user so the server can read the 0600 dev keys in the
    # bind-mounted ./dev-certs. Set RMM_UID/RMM_GID in .env if yours differ.
    user: "${RMM_UID:-1000}:${RMM_GID:-1000}"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rmm}:${POSTGRES_PASSWORD:-rmm-dev-password}@db:5432/${POSTGRES_DB:-rmm}
      RMM_DB_MAX_CONNECTIONS: ${RMM_DB_MAX_CONNECTIONS:-10}
      RMM_QUIC_LISTEN: 0.0.0.0:4433
      # WebSocket-over-TLS fallback for UDP-blocked networks: TCP, same port.
      RMM_WS_LISTEN: 0.0.0.0:4433
      RMM_API_LISTEN: 0.0.0.0:8443
      # STUN responder: agents and viewers learn their public addresses from
      # it to connect to each other directly (sessions are end-to-end
      # encrypted either way). The announced port must be the published one.
      RMM_STUN_LISTEN: 0.0.0.0:3478
      RMM_STUN_ANNOUNCE_PORT: ${RMM_STUN_PORT:-3478}
      # Prometheus metrics (plain HTTP, no auth): published on loopback only.
      RMM_METRICS_LISTEN: 0.0.0.0:9464
      RMM_CERTS_DIR: /certs
      RMM_SESSION_TTL_SECS: ${RMM_SESSION_TTL_SECS:-43200}
      RMM_PUBLIC_URL: ${RMM_PUBLIC_URL:-https://localhost:8443}
      RMM_UPDATES_DIR: /updates
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./dev-certs:/certs:ro
      - ./updates:/updates:ro
    ports:
      - "${RMM_API_PORT:-8443}:8443/tcp"
      - "${RMM_QUIC_PORT:-4433}:4433/udp"
      - "${RMM_WS_PORT:-4433}:4433/tcp"
      - "${RMM_STUN_PORT:-3478}:3478/udp"
      - "127.0.0.1:${RMM_METRICS_PORT:-9464}:9464/tcp"

volumes:
  pgdata:

[package]
name = "server"
description = "Central RMM server: QUIC listener for agents, HTTPS API for users."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
brand.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
axum-server.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
rcgen.workspace = true
clap.workspace = true
common.workspace = true
futures-util.workspace = true
hex.workspace = true
prometheus-client.workspace = true
protocol.workspace = true
quinn.workspace = true
# Replies from the address each STUN request was sent to (see `stun`).
quinn-udp = "0.5"
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
transport.workspace = true
totp-rs.workspace = true
tracing.workspace = true
msi = "0.10"
cab = "0.6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
openh264.workspace = true
viewer = { path = "../viewer" }
rcgen.workspace = true
x509-parser = "0.18"
tempfile.workspace = true
agent.workspace = true
peer.workspace = true
postcard.workspace = true
reqwest = { workspace = true, features = ["stream"] }
testcontainers-modules.workspace = true
futures-util = { workspace = true, features = ["sink"] }

tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

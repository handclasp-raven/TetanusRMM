[package]
name = "peer"
description = "End-to-end encrypted agent-viewer sessions (Noise) and direct peer-to-peer paths (NAT traversal)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
common.workspace = true
if-addrs = "0.15"
postcard.workspace = true
protocol.workspace = true
quinn.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# Same version rustls uses: verifies the agent's certificate chain.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde.workspace = true
# risky-raw-split: session records are sealed under the handshake's split
# keys with explicit nonces (see `noise`), not with snow's transport mode.
snow = { version = "0.10", features = ["risky-raw-split"] }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
x509-parser = "0.18"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

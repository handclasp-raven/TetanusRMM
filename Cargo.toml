[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/common",
    "crates/server",
    "crates/agent",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
common = { path = "crates/common" }
server = { path = "crates/server" }
agent = { path = "crates/agent" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
tempfile = "3"
argon2 = "0.6"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
ring = "0.17"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "derive", "migrate", "chrono", "json"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
ed25519-dalek = "3"
semver = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"
tray-icon = "0.25"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
time = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }

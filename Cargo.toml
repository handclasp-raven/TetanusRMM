[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/common",
    "crates/transport",
    "crates/server",
    "crates/agent",
    "crates/assist",
    "crates/viewer",
    "crates/peer",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
common = { path = "crates/common" }
transport = { path = "crates/transport" }
server = { path = "crates/server" }
agent = { path = "crates/agent" }
peer = { path = "crates/peer" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
tempfile = "3"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
ring = "0.17"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "derive", "migrate", "chrono", "json"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
ed25519-dalek = "3"
semver = "1"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"
tray-icon = "0.25"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
time = "0.3"
openh264 = "0.9"
winit = "0.30"
# Native file dialogs for the viewer (Windows/macOS natively, Linux via the
# XDG desktop portal).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
softbuffer = "0.4"
font8x8 = "0.3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
prometheus-client = "0.25"
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }

# Windows Installer needs table rows in stored-key order; see vendor/msi/RMM-PATCH.md.
[patch.crates-io]
msi = { path = "vendor/msi" }

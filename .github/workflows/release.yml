# Publishes a release when a version tag is pushed:
#
#   - the server image, to ghcr.io/<owner>/<repo>:<version> and :latest;
#   - the Windows agent (unsigned: each server signs it with its own key),
#     the viewers, the quick assist client, the TUI wheel,
#     docker-compose.yml and the install
#     scripts, as assets of a GitHub release, with their SHA256SUMS;
#   - a software bill of materials for each of those and for the server,
#     as rmm-sboms.tar.gz in the same release.
#
# scripts/install.sh installs and upgrades servers from these.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the versions in the tree
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tui=$(sed -n 's/^version = "\(.*\)"/\1/p' tui/pyproject.toml | head -n 1)
          if [ "$version" != "$cargo" ] || [ "$version" != "$tui" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $cargo and tui/pyproject.toml $tui must agree"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A pre-release (1.2.3-rc1) is not what `install.sh --upgrade` and
          # the :latest tag move to.
          case $version in
            *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=$image:latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      # The builder images hold only toolchains; `load` hands them to the
      # build scripts, which skip building an image that already exists.
      - name: Windows toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/agent-windows.Dockerfile
          tags: rmm-agent-windows-builder
          load: true
          cache-from: type=gha,scope=agent-windows
          cache-to: type=gha,scope=agent-windows,mode=max

      - name: Linux viewer toolchain image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/viewer-linux.Dockerfile
          tags: rmm-viewer-linux-builder
          load: true
          cache-from: type=gha,scope=viewer-linux
          cache-to: type=gha,scope=viewer-linux,mode=max

      - name: Build the agent, the viewers and the TUI
        run: |
          scripts/build-windows-agent.sh --unsigned
          scripts/build-clients.sh --no-publish

      - name: Collect the release files
        run: |
          mkdir dist
          cp target/windows-x86_64/rmm-agent.exe dist/rmm-agent-windows-x86_64.exe
          cp target/clients/rmm-viewer.exe dist/rmm-viewer-windows-x86_64.exe
          cp target/clients/rmm-assist.exe dist/rmm-assist-windows-x86_64.exe
          cp target/clients/rmm-viewer dist/rmm-viewer-linux-x86_64
          cp target/clients/tetanus_rmm-*.whl docker-compose.yml scripts/install.sh scripts/lib.sh dist/
          cd dist
          sha256sum -- * > SHA256SUMS

      - uses: anchore/sbom-action/download-syft@v0
        id: syft

      # After SHA256SUMS: install.sh downloads every file listed there, and
      # a server has no use for the SBOMs.
      - name: Software bills of materials
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          scripts/build-sboms.sh "${{ steps.version.outputs.version }}"
          tar -czf dist/rmm-sboms.tar.gz -C target sbom

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # Last, so that a release never points at an image that is not there.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --generate-notes ${{ steps.version.outputs.prerelease }}
